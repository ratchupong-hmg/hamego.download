<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAMEGO Download Portal</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Prompt, Thonburi, sans-serif;
    background:#f8f7f3;
}

.container{
    width:100%;
    max-width:430px;
    margin:auto;
    min-height:100vh;
    background:white;
    padding:20px;
}

.logo{
    width:150px;
    display:block;
    margin:auto;
}

h3{
    text-align:center;
    margin:20px 0;
}

.gallery{
    position:relative;
}

.preview{
    width:100%;
    border-radius:12px;
}

#prevBtn,
#nextBtn{

    position:absolute;
    top:50%;

    transform:translateY(-50%);

    width:40px;
    height:40px;

    border:none;
    border-radius:50%;

    background:rgba(0,0,0,.5);
    color:white;

    font-size:20px;
    cursor:pointer;
}

#prevBtn{
    left:10px;
}

#nextBtn{
    right:10px;
}

.indicator{
    text-align:center;
    margin-top:10px;
}

.button-group{
    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.btn{
    display:block;
    text-align:center;
    text-decoration:none;
    background:black;
    color:white;
    padding:14px;
    border-radius:10px;
}

.social{
    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.social-btn{
    display:block;
    text-align:center;
    text-decoration:none;
    background:#ececec;
    color:black;
    padding:12px;
    border-radius:10px;
}

.follow{
    margin-top:10px;
    text-align:center;
}

.follow a{
    display:inline-block;
}

.follow{
    display:flex;
    flex-direction: column;
    align-items: center;
}

.follow .icons{
    display:flex;
    gap:15px;
    margin-top:10px;
}

</style>
</head>

<body>
<div class="container">
<img src="/static/img/HAMEGO_Photobooth_Brand.png" class="logo">
<h3>Your Photo</h3>
<div class="gallery">
    <button id="prevBtn">&lt;</button>
    <img id="preview" class="preview" src="{{ photos[0] }}">
    <button id="nextBtn">&gt;</button>
</div>

<div class="indicator">
    <span id="counter">1 / {{ photos|length }}</span>
</div>

<div class="button-group">
    <a id="downloadBtn" href="{{ photos[0] }}" target="_blank" class="btn" download>Download Photo</a>	
</div>


<div class="social">
    <button id="shareBtn" class="btn">Share Photo</button>
</div>


<div class="follow">
    <h3>Follow Us</h3>
    <div class="icons">
        <a href="https://www.facebook.com/profile.php?id=61590750110944" target="_blank">
            <img src="/static/img/facebook-icon.png" alt="Facebook" width="32">
        </a>

        <a href="https://instagram.com/" target="_blank">
            <img src="/static/img/instagram-icon.png" alt="Instagram" width="32">
        </a>
    </div>
</div>
</div>
<footer style="text-align:center; margin-top:30px;">
    <div style="font-size:10px; color:#888;">Powered by HAMEGO Creation Team</div>
    <div style="font-size:9px; color:#aaa;">• Beta v1.001</div>
</footer>
<script>

const photos = {{ photos|tojson }};

let currentIndex = 0;

const preview =
    document.getElementById("preview");

const counter =
    document.getElementById("counter");

const downloadBtn =
    document.getElementById("downloadBtn");

function updatePhoto(){

    const currentPhoto =
        photos[currentIndex];

    preview.src =
        currentPhoto;

    downloadBtn.href =
        currentPhoto;

    counter.innerText =
        `${currentIndex + 1} / ${photos.length}`;
}

const shareBtn =
    document.getElementById("shareBtn");

shareBtn.addEventListener("click", async () => {

    const currentPhoto =
        photos[currentIndex];

    try{

        const response =
            await fetch(currentPhoto);

        const blob =
            await response.blob();

        const file =
            new File(
                [blob],
                "HAMEGO Photo.jpg",
                {
                    type: blob.type
                }
            );

        if(
            navigator.canShare &&
            navigator.canShare({
                files:[file]
            })
        ){

            await navigator.share({

                title:"HAMEGO Photo",

                text:"Shared from HAMEGO",

                files:[file]

            });

        }
        else{

            await navigator.share({

                title:"HAMEGO Photo",

                text:"Shared from HAMEGO",

                url:currentPhoto

            });

        }

    }
    catch(err){

        console.log(err);

        alert("Share cancelled.");

    }

});


document
.getElementById("nextBtn")
.addEventListener("click", ()=>{

    currentIndex++;

    if(currentIndex >= photos.length){
        currentIndex = 0;
    }
    updatePhoto();
});

document
.getElementById("prevBtn")
.addEventListener("click", ()=>{

    currentIndex--;

    if(currentIndex < 0){
        currentIndex = photos.length - 1;
    }

    updatePhoto();
});

let touchStartX = 0;
let touchEndX = 0;

preview.addEventListener(
    "touchstart",
    e=>{
        touchStartX =
            e.changedTouches[0].screenX;
    }
);

preview.addEventListener(
    "touchend",
    e=>{

        touchEndX =
            e.changedTouches[0].screenX;

        const distance =
            touchEndX - touchStartX;

        if(distance > 50){

            currentIndex--;

            if(currentIndex < 0){
                currentIndex =
                    photos.length - 1;
            }

            updatePhoto();
        }

        if(distance < -50){

            currentIndex++;

            if(currentIndex >= photos.length){
                currentIndex = 0;
            }

            updatePhoto();
        }
    }
);

updatePhoto();

</script>

</body>
</html>
